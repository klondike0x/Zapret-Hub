name: Release Build

# Mirrors local scripts:
# - portable-*: scripts/build_nuitka.ps1 (+ UninstallerOnly) then prepare_nuitka_release.py
# - installer: scripts/build_nuitka_installer.ps1 slim path (no -X64Source/-Arm64Source, no payload zips)
# - publish: attach artifacts to the GitHub Release (no rebuild)
#
# Compiler: MSVC is provisioned explicitly on GitHub-hosted runners and is the
# supported compiler for every published Windows architecture.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag or release version (for example v3.0.3)"
        required: true
        default: "v3.0.3"
      release_name:
        description: "Release title"
        required: true
        default: "Zapret Hub 3.0.3"
      changelog:
        description: "Release changelog (optional; otherwise .github/release-notes/$version.md)"
        required: false
        default: ""

jobs:
  portable-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v?\d') { $tag = "v3.0.3" }
          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable app (local build_nuitka.ps1)
        shell: pwsh
        run: |
          .\scripts\build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Version "${{ steps.meta.outputs.version }}" -Compiler msvc

      - name: Build uninstaller only
        shell: pwsh
        run: |
          .\scripts\build_nuitka_installer.ps1 -Python python -OutputDir dist_installer -UninstallerOnly -Compiler msvc

      - name: Optional Authenticode sign portable binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_ALLOW_SELF_SIGNED: ${{ vars.WINDOWS_SIGNING_ALLOW_SELF_SIGNED }}
        run: |
          if (-not (Test-Path .\scripts\sign_windows_artifacts.ps1)) { throw "sign_windows_artifacts.ps1 is missing." }
          .\scripts\prepare_windows_signing.ps1
          $targets = @(
            ".\dist_nuitka\main.dist\Zapret_Hub.exe",
            ".\dist_installer\uninstall_zaprethub.exe"
          )
          $runtimeTargets = @(
            ".\dist_nuitka\main.dist\runtime\tg-ws-proxy\bin\TgWsProxy_windows.exe",
            ".\dist_nuitka\main.dist\runtime\zapret-discord-youtube\bin\winws.exe",
            ".\dist_nuitka\main.dist\runtime\zapret2\binaries\windows-x86_64\winws2.exe"
          )
          $targets = @($targets + $runtimeTargets) | Where-Object { Test-Path -LiteralPath $_ }
          if ($targets.Count -eq 0) { throw "No portable binaries found to sign." }
          .\scripts\sign_windows_artifacts.ps1 -Files $targets -RequireSignature

      - name: Zip portable x64
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path ".\release_$version" | Out-Null
          python .\scripts\prepare_nuitka_release.py `
            --x64-source .\dist_nuitka\main.dist `
            --release-dir ".\release_$version" `
            --version $version `
            --uninstaller-x64 .\dist_installer\uninstall_zaprethub.exe
      - uses: actions/upload-artifact@v6
        with:
          name: release-portable-win-x64
          path: release_${{ steps.meta.outputs.version }}/zapret_hub_${{ steps.meta.outputs.version }}_portable_win_x64.zip
          if-no-files-found: error

  portable-arm64:
    # Do not publish an ARM64 build until every bundled WinDivert-dependent
    # runtime is native ARM64. An ARM UI paired with x64 drivers is misleading.
    if: ${{ false }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v?\d') { $tag = "v3.0.3" }
          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable app (local build_nuitka.ps1)
        shell: pwsh
        run: |
          .\scripts\build_nuitka.ps1 -Python python -OutputDir dist_nuitka -Version "${{ steps.meta.outputs.version }}" -Compiler msvc

      - name: Build uninstaller only
        shell: pwsh
        run: |
          .\scripts\build_nuitka_installer.ps1 -Python python -OutputDir dist_installer -UninstallerOnly -Compiler msvc

      - name: Optional Authenticode sign portable binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_ALLOW_SELF_SIGNED: ${{ vars.WINDOWS_SIGNING_ALLOW_SELF_SIGNED }}
        run: |
          if (-not (Test-Path .\scripts\sign_windows_artifacts.ps1)) { throw "sign_windows_artifacts.ps1 is missing." }
          .\scripts\prepare_windows_signing.ps1
          $targets = @(
            ".\dist_nuitka\main.dist\Zapret_Hub.exe",
            ".\dist_installer\uninstall_zaprethub.exe"
          )
          $runtimeTargets = @(
            ".\dist_nuitka\main.dist\runtime\tg-ws-proxy\bin\TgWsProxy_windows.exe",
            ".\dist_nuitka\main.dist\runtime\zapret-discord-youtube\bin\winws.exe",
            ".\dist_nuitka\main.dist\runtime\zapret2\binaries\windows-x86_64\winws2.exe"
          )
          $targets = @($targets + $runtimeTargets) | Where-Object { Test-Path -LiteralPath $_ }
          if ($targets.Count -eq 0) { throw "No portable binaries found to sign." }
          .\scripts\sign_windows_artifacts.ps1 -Files $targets -RequireSignature

      - name: Zip portable arm64
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path ".\release_$version" | Out-Null
          python .\scripts\prepare_nuitka_release.py `
            --arm64-source .\dist_nuitka\main.dist `
            --release-dir ".\release_$version" `
            --version $version `
            --uninstaller-arm64 .\dist_installer\uninstall_zaprethub.exe
      - uses: actions/upload-artifact@v6
        with:
          name: release-portable-win-arm64
          path: release_${{ steps.meta.outputs.version }}/zapret_hub_${{ steps.meta.outputs.version }}_portable_win_arm64.zip
          if-no-files-found: error

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clean leftover payload dirs
        shell: pwsh
        run: |
          Remove-Item .\installer_payload, .\bundled_uninstaller, .\dist_installer -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: pwsh
        env:
          PIP_PREFER_BINARY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v?\d') { $tag = "v3.0.3" }
          $version = $tag.TrimStart("v")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      # Identical to local slim: no -X64Source / -Arm64Source, no installer_payload zips.
      # Builds one custom graphical installer without an external setup wrapper.
      - name: Build slim installer (local build_nuitka_installer.ps1)
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_ALLOW_SELF_SIGNED: ${{ vars.WINDOWS_SIGNING_ALLOW_SELF_SIGNED }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $logPath = Join-Path $env:RUNNER_TEMP "zapret-hub-installer-build.log"
          .\scripts\prepare_windows_signing.ps1
          .\scripts\build_nuitka_installer.ps1 `
            -Python python `
            -OutputDir dist_installer `
            -Version $version `
            -Compiler msvc `
            -SkipPrepareRelease 2>&1 | Tee-Object -FilePath $logPath
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            # Surface the useful part of a public CI failure without exposing secrets.
            $tail = (Get-Content -LiteralPath $logPath -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
            $escapedTail = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Slim installer build failed::$escapedTail"
            exit $buildExitCode
          }

          # Sign the single graphical installer produced by Nuitka.
          $installerPath = ".\dist_installer\install_zaprethub_${version}_universal.exe"
          .\scripts\sign_windows_artifacts.ps1 -Files @($installerPath) -RequireSignature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanity-check installer size
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $installer = Get-Item ".\dist_installer\install_zaprethub_${version}_universal.exe"
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Slim installer size: $mb MB (no portable app zips / installer_payload)"
          if ($installer.Length -gt (220MB)) {
            throw "Installer too large ($mb MB > 220 MB). Fat/uncompressed build rejected."
          }
          if ($installer.Length -lt (5MB)) {
            throw "Installer suspiciously small ($mb MB < 5 MB)."
          }

      - uses: actions/upload-artifact@v6
        with:
          name: release-slim-installer
          path: dist_installer/install_zaprethub_${{ steps.meta.outputs.version }}_universal.exe
          if-no-files-found: error

  package-release:
    needs:
      - portable-x64
      - installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release metadata
        id: release_meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not $tag) { $tag = "v3.0.3" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a version tag such as v3.0.4, got: $tag" }
          $version = $tag.TrimStart("v")
          $name = "${{ inputs.release_name }}"
          if (-not $name) { $name = "Zapret Hub $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: .artifacts
          pattern: release-*
          merge-multiple: true

      - name: Stage release folder
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $releaseDir = ".\release_$version"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Write-Host "Downloaded artifacts:"
          Get-ChildItem .\.artifacts -Recurse -File | ForEach-Object {
            Write-Host " - $($_.FullName.Substring((Resolve-Path .\.artifacts).Path.Length + 1))"
          }

          $required = @(
            "zapret_hub_${version}_portable_win_x64.zip",
            "install_zaprethub_${version}_universal.exe"
          )
          foreach ($name in $required) {
            $found = Get-ChildItem .\.artifacts -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $found) { throw "Missing required release asset: $name" }
            Copy-Item $found.FullName (Join-Path $releaseDir $name) -Force
            Write-Host "Staged $name ($([math]::Round($found.Length/1MB,1)) MB)"
          }

          # Digests for mirror/in-app updates: log only (do not attach sidecar files to the GitHub Release).
          foreach ($arch in @('x64')) {
            $zipName = "zapret_hub_${version}_portable_win_${arch}.zip"
            $zipPath = Join-Path $releaseDir $zipName
            $hash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
            Write-Host "Digest $arch = sha256:$hash (for mirror JSON; not uploaded as a release asset)"
          }

      - name: Optional Authenticode signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_ALLOW_SELF_SIGNED: ${{ vars.WINDOWS_SIGNING_ALLOW_SELF_SIGNED }}
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $releaseDir = ".\release_$version"
          if (-not (Test-Path .\scripts\sign_windows_artifacts.ps1)) { throw "sign_windows_artifacts.ps1 is missing." }
          .\scripts\prepare_windows_signing.ps1
          $targets = @((Join-Path $releaseDir "install_zaprethub_${version}_universal.exe"))
          .\scripts\sign_windows_artifacts.ps1 -Files $targets -RequireSignature

      - name: Generate WinGet portable manifests
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $releaseDir = ".\release_$version"
          python .\scripts\generate_winget_manifests.py `
            --version $version `
            --x64-archive "$releaseDir\zapret_hub_${version}_portable_win_x64.zip" `
            --output-dir "$releaseDir\winget" `
            --release-base-url "https://github.com/klondike0x/zapret-hub-continuation/releases/download/$tag" `
            --bundle "$releaseDir\winget-manifests-${version}.zip"

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate
          path: release_${{ steps.release_meta.outputs.version }}/*
          if-no-files-found: error

  publish:
    name: Sign and publish immutable release
    needs: package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then tag="$INPUT_TAG"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a version tag such as v3.0.4, got: $tag" >&2; exit 1; }
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git cat-file -e "$tag^{tag}" || { echo "Release tag must be an annotated tag: $tag" >&2; exit 1; }
          gpg --batch --import release-signing-key.asc
          git verify-tag "$tag"
          git merge-base --is-ancestor "$tag^{commit}" "origin/${{ github.event.repository.default_branch }}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=Zapret Hub $version" >> "$GITHUB_OUTPUT"

      - name: Download release candidate
        uses: actions/download-artifact@v6
        with:
          name: release-candidate
          path: release-assets

      - name: Require protected GPG signing secrets
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_GPG_PRIVATE_KEY" || { echo 'RELEASE_GPG_PRIVATE_KEY is not configured.' >&2; exit 1; }
          test -n "$RELEASE_GPG_PASSPHRASE" || { echo 'RELEASE_GPG_PASSPHRASE is not configured.' >&2; exit 1; }

      - name: Sign release checksum manifest
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          expected='40015491B3A63D777855FEC08DA82B54BDED31AE'
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          public_fingerprint="$(gpg --show-keys --with-colons release-signing-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          secret_fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$public_fingerprint" = "$expected" || { echo "Unexpected public key fingerprint: $public_fingerprint" >&2; exit 1; }
          test "$secret_fingerprint" = "$expected" || { echo "GPG secret does not match the trusted public key: $secret_fingerprint" >&2; exit 1; }
          cd release-assets
          sha256sum *.exe *.zip | sort > SHA256SUMS.txt
          printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          chmod 600 "$RUNNER_TEMP/gpg-passphrase"
          gpg --batch --yes --armor --detach-sign --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/gpg-passphrase" \
            --local-user "$expected" --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          cp ../release-signing-key.asc .
          rm -f "$RUNNER_TEMP/gpg-passphrase"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.zip

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          notes_path=".github/release-notes/$RELEASE_VERSION.md"
          if [ -f "$notes_path" ]; then
            cp "$notes_path" RELEASE_NOTES.md
          elif [ -n "$INPUT_CHANGELOG" ]; then
            printf '%s\n' "$INPUT_CHANGELOG" > RELEASE_NOTES.md
          else
            printf '%s\n' "## Assets" "- Zapret Hub $RELEASE_VERSION installer and Portable x64 build" > RELEASE_NOTES.md
          fi
          printf '%s\n' \
            '' \
            '## Проверка подлинности и целостности' \
            '' \
            "- Релиз собран из подписанного GPG Git-тега $RELEASE_TAG." \
            '- SHA256SUMS.txt подписан GPG; открытый ключ опубликован как release-signing-key.asc.' \
            '- Fingerprint: 4001 5491 B3A6 3D77 7855 FEC0 8DA8 2B54 BDED 31AE.' \
            '- Перед публикацией GitHub Actions скачивает релиз обратно и повторно проверяет подпись и SHA-256.' \
            '- Повторная публикация существующего тега запрещена.' \
            >> RELEASE_NOTES.md
      - name: Refuse to modify an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to modify an immutable release." >&2
            exit 1
          fi

      - name: Create draft release with signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.name }}
        run: |
          set -euo pipefail
          echo "RELEASE_DRAFT_CREATED=false" >> "$GITHUB_ENV"
          mapfile -t release_assets < <(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' -o -name 'SHA256SUMS.txt.asc' -o -name 'release-signing-key.asc' \) \
              -print | sort
          )
          if (( ${#release_assets[@]} != 6 )); then
            echo "Expected exactly 6 release files, found ${#release_assets[@]}." >&2
            printf '%s\n' "${release_assets[@]}" >&2
            exit 1
          fi
          printf 'Uploading release asset: %s\n' "${release_assets[@]}"
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes-file RELEASE_NOTES.md \
            --draft --verify-tag
          echo "RELEASE_DRAFT_CREATED=true" >> "$GITHUB_ENV"

      - name: Redownload and verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir redownload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir redownload
          cd redownload
          gpg --batch --import release-signing-key.asc
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish verified immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Remove failed draft release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          if [[ "${RELEASE_DRAFT_CREATED:-false}" != "true" ]]; then
            echo "No draft release was created by this workflow run; skipping cleanup."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false
          fi